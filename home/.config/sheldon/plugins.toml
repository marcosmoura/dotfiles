shell = "zsh"

# What an interactive shell loads on top of ~/.zshrc, in this order.
#
# ~/.zshrc loads what the first prompt needs, then runs the code that
# `sheldon source` makes from this file (it keeps a copy in
# ~/.cache/zsh/plugins.zsh). Entries without `apply` load on the spot. Entries
# with the `defer` template load once the prompt is on screen. The local
# entries are the deferred half of ~/.config/zsh.

[templates]
# zsh-defer runs a command as soon as the line editor is idle. By default it
# also runs every precmd hook and redraws the prompt after each command, which
# costs more than the plugins do. -m and -p turn that off; the `settle` entry
# at the end runs the hooks once for all of them.
defer = "{% for file in files %}zsh-defer -mp source \"{{ file }}\"\n{% endfor %}"

# ==============================================================================
# BEFORE THE FIRST PROMPT
# ==============================================================================

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

# Key bindings have to be there for the first key press
[plugins.ohmyzsh-key-bindings]
github = "ohmyzsh/ohmyzsh"
dir = "lib"
use = ["key-bindings.zsh"]

# Extra completion definitions. Only put on fpath, for compinit to find.
[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
dir = "src"
apply = ["fpath"]

# ==============================================================================
# COMPLETION
# ==============================================================================

# compinit. Everything below that defines a completion needs it first.
[plugins.completion]
local = "~/.config/zsh/deferred"
use = ["completion.zsh"]
apply = ["defer"]

# Completion options and styles: menu selection, case-insensitive matching
[plugins.ohmyzsh-completion]
github = "ohmyzsh/ohmyzsh"
dir = "lib"
use = ["completion.zsh"]
apply = ["defer"]

[plugins.yarn-completion]
github = "chrisands/zsh-yarn-completions"
apply = ["defer"]

[plugins.nx-completion]
github = "jscutlery/nx-completion"
apply = ["defer"]

# ==============================================================================
# TOOLS
# ==============================================================================

# fzf, atuin, zoxide, direnv, luarocks, mise. Before the plugins below, so that
# syntax highlighting sees the widgets that fzf and atuin define.
[plugins.tools]
local = "~/.config/zsh/deferred"
use = ["tools.zsh"]
apply = ["defer"]

# After the tools: it looks up its helper binary, pnpm-shell-completion, when
# it loads, and that is a mise tool (see ~/.config/mise/config.toml).
[plugins.pnpm-completion]
github = "g-plane/pnpm-shell-completion"
apply = ["defer"]

# ==============================================================================
# PLUGINS
# ==============================================================================

[plugins.ohmyzsh-plugins]
github = "ohmyzsh/ohmyzsh"
dir = "plugins"
use = ["{aliases,cp,dircycle}/*.plugin.zsh"]
apply = ["defer"]

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
use = ["{{ name }}.zsh"]
apply = ["defer"]

[plugins.zsh-you-should-use]
github = "MichaelAquilina/zsh-you-should-use"
apply = ["defer"]

# Last of the plugins: it wraps the widgets that exist when it loads
[plugins.syntax-highlight]
github = "marcosmoura/fast-syntax-highlighting"
apply = ["defer"]

# ==============================================================================
# SETTLE
# ==============================================================================

# Run the precmd hooks once, now that everything is loaded. This is what
# applies direnv to the first prompt and starts autosuggestions on it.
[plugins.settle]
inline = "zsh-defer -p -c :"
