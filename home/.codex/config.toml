approval_policy = "on-request"
sandbox_mode = "workspace-write"
default_permissions = "workspace-no-secrets"
personality = "pragmatic"
approvals_reviewer = "guardian_subagent"
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "medium"
service_tier = "default"

[sandbox_workspace_write]
network_access = false

# Workspace sandbox that also blocks reads of credential files.
# Real paths are listed because ~/.codex and ~/.config are symlinks into this repo.
[permissions.workspace-no-secrets]
extends = ":workspace"

[permissions.workspace-no-secrets.filesystem]
"~/.secrets" = "none"
"~/.ssh" = "none"
"~/.aws" = "none"
"~/.gnupg" = "none"
"~/.claude.json" = "none"
"~/Projects/dotfiles/home/.codex/auth.json" = "none"
"~/Projects/dotfiles/home/.config/opencode/service.json" = "none"

# The key is read from ~/.secrets on connect, so it works without the shell env.
[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
http_headers_helper = """key=$(cat "$HOME/.secrets/context7-key") || exit 1; printf '{"CONTEXT7_API_KEY":"%s"}' "$key""""

[mcp_servers.grep]
url = "https://mcp.grep.app"

[mcp_servers.deepwiki]
url = "https://mcp.deepwiki.com/mcp"

[projects."/Users/marcosmoura/Projects/sonora"]
trust_level = "trusted"

[projects."/Users/marcosmoura/Projects"]
trust_level = "trusted"

[projects."/Users/marcosmoura/Projects/stache"]
trust_level = "trusted"

[projects."/Users/marcosmoura/Projects/self-hosting"]
trust_level = "trusted"

[projects."/Users/marcosmoura/Projects/dotfiles"]
trust_level = "trusted"

[projects."/Users/marcosmoura/Projects/life-planner"]
trust_level = "trusted"

[projects."/Users/marcosmoura/Projects/budget"]
trust_level = "trusted"

[features]
hooks = true
guardian_approval = true
prevent_idle_sleep = true
multi_agent = true

[tui]
status_line = [
  "model-with-reasoning",
  "context-remaining",
  "current-dir",
  "five-hour-limit",
  "weekly-limit",
  "session-id",
  "fast-mode",
]
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-6.1-sol" = 4

[notice]
fast_default_opt_out = true

[plugins."build-web-apps@openai-curated"]
enabled = true

[plugins."build-ios-apps@openai-curated"]
enabled = true

[plugins."build-macos-apps@openai-curated"]
enabled = true

